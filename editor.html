<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zedit</title>
    <style>
      html,
      body,
      #editor-root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        letter-spacing: 0.02em;
        background: #0f1115;
        z-index: 9999;
      }
    </style>
    <link rel="stylesheet" href="./dist/editor.css">
  </head>
  <body class="zui-root">
    <div id="boot-loading" role="status" aria-live="polite" aria-busy="true">Opening Zedit…</div>
    <noscript>
      Zedit requires JavaScript to run. Please enable JavaScript and reopen this file.
    </noscript>
    <main id="zedit-root">
      <div id="editor-root"></div>
    </main>
    <script src="./dist/editor.js"></script>
  </body>
</html>
